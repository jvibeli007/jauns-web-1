name: Request celebrity finance snapshot 2

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "assets/**"
      - "config/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/daily-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate latest snapshot
        run: npm run update
      - name: Commit snapshot if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update requested celebrity snapshot"
          file_pattern: "data/*.json data/history/*.json"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
